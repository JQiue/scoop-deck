name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo and nshm builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nsh
            target
            .nsh/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'nsh.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Scoop
        shell: pwsh
        run: |
          irm get.scoop.sh | iex
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append
          scoop --version

      - name: Install nsh
        shell: pwsh
        run: |
          scoop install https://github.com/longbridge/nsh/releases/latest/download/nsh.json
          nsh --version

      - name: Install the main bucket for headless UI tests
        shell: pwsh
        run: |
          scoop bucket add main
          scoop list

      - name: Install nshm dependencies
        shell: pwsh
        run: nsh add nsh-omarchy

      - name: Typecheck and cargo check
        run: nsh check

      - name: Build
        run: nsh build

      - name: Test
        run: nsh test
