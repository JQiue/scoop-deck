settings.importConfirmTitle:
  en: "Import from a Scoopfile?"
  zh-CN: "从 Scoopfile 导入？"
settings.importConfirmDesc:
  en: "This uses %{path} to install missing apps and add their buckets. It can take a long time; do not close the window or run other actions."
  zh-CN: "将使用 %{path}，安装文件里缺少的应用、添加对应 bucket。可能需要很久，期间不要关闭窗口，也不要再执行其它操作。"
settings.cleanupTitle:
  en: "Clean old versions?"
  zh-CN: "清理旧版本？"
settings.cleanupDesc:
  en: "Delete the old version directories kept by every app, keeping only the current version. Installed apps are not affected."
  zh-CN: "删除所有应用保留的旧版本目录，只保留当前版本。已安装的应用不受影响。"
settings.cleanup:
  en: "Clean"
  zh-CN: "清理"
settings.clearCacheTitle:
  en: "Clear the download cache?"
  zh-CN: "清理下载缓存？"
settings.clearCacheDesc:
  en: "Delete %{count} files (about %{size}) from the cache. Installed apps are not affected; reinstalling downloads them again."
  zh-CN: "将删除缓存里的 %{count} 个文件（约 %{size}）。已安装的应用不受影响，只是下次重装需要重新下载。"

# Scoop setup
setup.title:
  en: "Scoop not detected"
  zh-CN: "未检测到 Scoop"
setup.desc:
  en: "ScoopDeck needs Scoop installed first. After installing it, come back and press Retry; if it is still not found, restart ScoopDeck."
  zh-CN: "ScoopDeck 需要先安装 Scoop。装好后回到这里点「重新检测」；如果仍然检测不到，重启一次 ScoopDeck。"
setup.powershell:
  en: "Run in PowerShell"
  zh-CN: "在 PowerShell 中运行"
setup.open:
  en: "Open scoop.sh"
  zh-CN: "打开 scoop.sh"
setup.retry:
  en: "Check again"
  zh-CN: "重新检测"

